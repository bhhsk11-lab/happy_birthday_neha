<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Neha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300;1,600&family=Nunito:wght@400;600&display=swap">
<style>
:root{--night:#1f0a26;--plum:#3a1240;--rose:#ff5c85;--sun:#ffc21a;--mari:#ff8a3d;--blush:#ffdbe6;--cream:#fff4e6;
--serif:"Fraunces",Georgia,serif;--sans:"Nunito",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;color:var(--cream);font-family:var(--sans);
background:radial-gradient(ellipse at 50% 45%,var(--plum),var(--night) 72%)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
body:not(.open) canvas{z-index:11}
.fl{position:fixed;z-index:1;pointer-events:none;opacity:0;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45));transition:translate .5s ease-out}
.fl svg{width:100%;height:100%;display:block}
body.open .fl{opacity:1;animation:bloom 1.9s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d)}
.spin svg{animation:spin 120s linear infinite}.sway svg{animation:sway 7s ease-in-out infinite alternate}
.f1{width:clamp(190px,42vw,470px);aspect-ratio:1;top:-9%;left:-9%;--d:.2s}
.f2{width:clamp(170px,36vw,400px);aspect-ratio:1;bottom:-8%;right:-7%;--d:.6s}
.f3{width:clamp(90px,17vw,200px);aspect-ratio:1;top:5%;right:4%;--d:1s}
.f4{width:clamp(100px,19vw,230px);aspect-ratio:1;bottom:2%;left:3%;--d:1.3s}
.f5{width:clamp(80px,13vw,160px);aspect-ratio:1;top:46%;right:-3%;--d:1.6s}
@keyframes bloom{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-6px,4px)}30%{transform:translate(5px,-5px)}45%{transform:translate(-4px,-3px)}60%{transform:translate(4px,3px)}80%{transform:translate(-2px,1px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(50px) rotate(-10deg) scale(.5)}60%{transform:translateY(-6px) rotate(2deg) scale(1.06)}to{opacity:1;transform:none}}

/* intro */
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
background:radial-gradient(ellipse at 50% 45%,var(--plum),var(--night) 72%);border:0;color:var(--cream);cursor:pointer;font:inherit;
transition:opacity 1.2s ease .5s,visibility 0s 1.7s}
#intro .bud{position:relative;margin-bottom:clamp(36px,9vw,70px);width:clamp(150px,34vw,230px);aspect-ratio:1;filter:drop-shadow(0 0 40px rgba(255,92,133,.55));animation:pulse 2.4s ease-in-out infinite;transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity .9s ease .3s}
#intro .bud svg{width:100%;height:100%}
#intro p{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.2rem,3.6vw,1.7rem);color:var(--blush);transition:opacity .5s}
#intro:focus-visible{outline:3px solid var(--blush);outline-offset:-10px}
@keyframes pulse{50%{transform:scale(1.07)}}
#intro::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle at 25% 30%,rgba(255,92,133,.3),transparent 40%),radial-gradient(circle at 75% 70%,rgba(255,194,26,.22),transparent 42%),radial-gradient(circle at 70% 20%,rgba(192,75,255,.22),transparent 40%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.1)}}
#intro .bud::before{content:"";position:absolute;inset:-70%;border-radius:50%;z-index:-1;background:conic-gradient(transparent,rgba(255,92,133,.55),transparent 28%,rgba(255,194,26,.5),transparent 58%,rgba(255,92,133,.5),transparent);filter:blur(26px);animation:spin 9s linear infinite}
#intro .bud::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid var(--blush);animation:tapring 2.2s ease-out infinite}
@keyframes tapring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.9);opacity:0}}
.orbit{position:absolute;inset:-48%;animation:spin 30s linear infinite;pointer-events:none}
.orbit i{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;margin:-10%;transform:rotate(var(--a)) translateY(-240%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.orbit i svg{width:100%;height:100%;animation:spin 12s linear infinite reverse}
.sp{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff3c4;box-shadow:0 0 8px 2px rgba(255,214,120,.8);opacity:0;pointer-events:none;animation:tw 3s ease-in-out var(--dl) infinite}
@keyframes tw{50%{opacity:1;transform:scale(1.7)}}
#intro .shim{font-size:clamp(1.5rem,5.4vw,2.6rem);font-weight:600;background:linear-gradient(90deg,var(--blush),#fff,var(--sun),var(--rose),var(--blush));background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 18px rgba(255,92,133,.45))}
@keyframes shine{to{background-position:-260% 0}}
#intro .tap{font-family:var(--sans);font-style:normal;font-weight:600;font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sun);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.ring{position:fixed;left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%;border:3px solid var(--blush);z-index:12;pointer-events:none;animation:ring 1.5s ease-out var(--d) both}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(20);opacity:0}}
.flash{position:fixed;inset:0;z-index:12;pointer-events:none;background:radial-gradient(circle,#fff 0,rgba(255,170,200,.85) 25%,rgba(255,194,26,.35) 55%,transparent 75%);animation:flash 1s ease-out both}
@keyframes flash{0%{opacity:0;transform:scale(.3)}25%{opacity:.95}to{opacity:0;transform:scale(1.6)}}
body.open #intro{opacity:0;visibility:hidden;pointer-events:none}
body.open #intro .bud{transform:scale(4) rotate(70deg);opacity:0;animation:none}
body.open #intro p{opacity:0}

main{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:20px;overflow-y:auto}
main>*{flex-shrink:0}
main.shake{animation:shake .6s ease-out}
main{scrollbar-width:none;-ms-overflow-style:none}main::-webkit-scrollbar{display:none}
.hb,.note,.cake{opacity:0}
.hb{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.4rem,4.4vw,2.5rem);margin:0;color:var(--blush);letter-spacing:.02em}
.name{font-family:var(--serif);font-style:italic;font-weight:600;margin:0;line-height:1;font-size:clamp(4rem,min(23vw,24vh),16rem);padding:0 .06em .1em;
filter:drop-shadow(0 6px 34px rgba(255,92,133,.4))}
.name span{display:inline-block;opacity:0}
body.open .name span{animation:pop 1.2s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(1.3s + var(--i)*.13s)}
.note{max-width:30ch;margin:8px 0 28px;font-size:clamp(1rem,2.5vw,1.15rem);line-height:1.6;color:var(--blush)}
body.open .hb{animation:rise 1.4s 1s both}body.open .note{animation:rise 1.4s 2.2s both}body.open .cake{animation:rise 1.4s 2.6s both}
.cake{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--blush);font:600 .95rem var(--sans);box-shadow:none}
.cake svg{width:clamp(150px,min(48vw,30vh),290px);height:auto;overflow:visible;transition:transform .3s}
.cake:hover svg{transform:translateY(-3px)}
.cake:focus-visible{outline:3px solid var(--blush);outline-offset:6px;border-radius:12px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.smoke{opacity:0}
.cake.out .flame,.cake.out .glow{display:none}
.cake.out .smoke{animation:smoke 2.6s ease-out forwards}
@keyframes smoke{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.wish{max-width:34ch;margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.15rem,3vw,1.5rem);line-height:1.55;min-height:0;transition:margin .6s}
.wish.on{margin-top:18px}
.cap{margin:10px 0 0;min-height:2em;font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,3.4vw,1.8rem);color:var(--sun);text-shadow:0 0 18px rgba(255,194,26,.5)}
.hb,.note,.wish{text-shadow:0 2px 16px rgba(31,10,38,.95),0 0 4px rgba(31,10,38,.7)}
@supports (height:100dvh){html,body{height:100dvh}}
@media (max-height:720px){.note{margin:4px 0 20px}.cake svg{width:170px}.wish.on{margin-top:10px}.cap{margin-top:6px}}
@media (max-height:560px){.hb{font-size:1.2rem}.note{display:none}.cake svg{width:130px}.wish{font-size:1rem}}
@media (prefers-reduced-motion:reduce){
#intro::before,#intro .bud::before,#intro .bud::after,.orbit,.orbit i svg,.sp,#intro .shim,#intro .tap{animation:none}
body.open .fl,body.open .name span,body.open .hb,body.open .note,body.open .cake,#intro .bud,.flame,.glow{animation:none;opacity:1}
.spin svg,.sway svg{animation:none}#intro{transition:none}}
</style>
</head>
<body>
<div class="fl f1 spin" id="f1" data-z="28"></div>
<div class="fl f2 sway" id="f2" data-z="38"></div>
<div class="fl f3 spin" id="f3" data-z="60"></div>
<div class="fl f4 sway" id="f4" data-z="48"></div>
<div class="fl f5 sway" id="f5" data-z="70"></div>
<canvas id="c" aria-hidden="true"></canvas>

<main>
  <p class="hb">Happy Birthday</p>
  <h1 class="name" id="name" aria-label="Neha"></h1>
  <p class="note">May this year open for you the way a flower does: slowly, brightly, and in its own sweet time.</p>
  <button class="cake" id="cake" type="button" aria-label="Blow out the candle and make a wish">
    <svg viewBox="0 0 160 150" aria-hidden="true">
      <ellipse cx="80" cy="138" rx="72" ry="9" fill="#fff4e6" opacity=".9"/>
      <rect x="20" y="78" width="120" height="58" rx="10" fill="#ff6f95"/>
      <rect x="20" y="104" width="120" height="8" fill="#ffdbe6" opacity=".5"/>
      <path d="M20 88Q20 72 36 72H124Q140 72 140 88Q132 98 122 88Q112 102 100 90Q90 102 80 90Q70 102 60 90Q50 102 38 88Q28 98 20 88Z" fill="#fff4e6"/>
      <g fill="#ffc21a"><circle cx="48" cy="122" r="7"/><circle cx="80" cy="122" r="7"/><circle cx="112" cy="122" r="7"/></g>
      <g fill="#5a2d10"><circle cx="48" cy="122" r="3"/><circle cx="80" cy="122" r="3"/><circle cx="112" cy="122" r="3"/></g>
      <rect x="75" y="42" width="10" height="32" rx="2" fill="#ffdbe6"/>
      <path d="M75 52L85 48M75 60L85 56M75 68L85 64" stroke="#ff5c85" stroke-width="2"/>
      <circle class="glow" cx="80" cy="26" r="28" fill="rgba(255,194,26,.22)"/>
      <g class="flame"><path d="M80 8C91 20 93 31 80 40C67 31 69 20 80 8Z" fill="#ffc21a"/><path d="M80 22C85 28 85 34 80 38C75 34 75 28 80 22Z" fill="#fff4e6"/></g>
      <path class="smoke" d="M80 38C72 28 88 20 80 8" fill="none" stroke="#fff4e6" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span id="hint">Tap the candle and make a wish</span>
  </button>
  <p class="wish" id="wish" aria-live="polite"></p>
  <p class="cap" id="cap"></p>
</main>

<button id="intro" type="button" aria-label="Open your birthday surprise">
  <div class="bud" id="bud"></div>
  <p id="introText" class="shim">A little something for Neha</p>
  <p class="tap">&#10022; tap to open &#10022;</p>
</button>

<script>
const NAME=(new URLSearchParams(location.search).get("to")||"Neha").trim().slice(0,14)||"Neha";
document.title="Happy Birthday, "+NAME;
document.getElementById("introText").textContent="A little something for "+NAME;
const nm=document.getElementById("name");nm.setAttribute("aria-label",NAME);
const cols=["#ffc21a","#ffa52e","#ff8a3d","#ff6f61","#ff5c85"];
[...NAME].forEach((ch,i,a)=>{const s=document.createElement("span");s.textContent=ch;s.style.setProperty("--i",i);
  s.style.color=cols[Math.floor(i/a.length*cols.length)];nm.appendChild(s);});

/* flowers */
function sunflower(){let s='<svg viewBox="-100 -100 200 200">';
 [{sc:1,off:0,f:"#f7a800"},{sc:.88,off:8.57,f:"#ffcb2b"}].forEach(r=>{for(let i=0;i<21;i++)
  s+=`<path d="M0,0C-15,-26 -12,-70 0,-94C12,-70 15,-26 0,0Z" fill="${r.f}" stroke="#c77f00" stroke-opacity=".35" transform="rotate(${i*360/21+r.off}) scale(${r.sc})"/>`});
 s+='<circle r="30" fill="#3b1d0c"/><circle r="24" fill="#5a2d10"/>';
 for(let k=1;k<=70;k++){const r=3*Math.sqrt(k),a=k*2.39996;s+=`<circle cx="${(r*Math.cos(a)).toFixed(1)}" cy="${(r*Math.sin(a)).toFixed(1)}" r="1.5" fill="#e0a64a" opacity=".75"/>`}
 return s+"</svg>"}
function rose(){let s='<svg viewBox="-100 -100 200 200">';
 const c=["#ff86a8","#f8567f","#e63a68","#d02a59","#b21c48","#8f1239"],n=[9,8,7,5,4,3];
 n.forEach((k,L)=>{for(let i=0;i<k;i++)s+=`<path d="M0,0C-36,-14 -48,-56 0,-64C48,-56 36,-14 0,0Z" fill="${c[L]}" stroke="#5c0a22" stroke-opacity=".28" stroke-width="1.2" transform="rotate(${i*360/k+L*31}) scale(${(1.5-L*.2).toFixed(2)})"/>`});
 return s+'<path d="M-9,0C-9,-12 9,-12 9,0C9,10 -6,12 -6,3C-6,-3 3,-4 3,0" fill="none" stroke="#6e0d2b" stroke-width="2.4" stroke-linecap="round"/></svg>'}
function blossom(){let s='<svg viewBox="-100 -100 200 200">';
 for(let i=0;i<5;i++)s+=`<path d="M0,0C-24,-20 -40,-62 -12,-78L0,-66L12,-78C40,-62 24,-20 0,0Z" fill="#ffe3ec" stroke="#f59ab6" stroke-width="1.3" transform="rotate(${i*72})"/>`;
 s+='<circle r="9" fill="#f06292"/>';
 for(let i=0;i<10;i++){const a=i*Math.PI/5,x=(24*Math.cos(a)).toFixed(1),y=(24*Math.sin(a)).toFixed(1);
  s+=`<line x2="${x}" y2="${y}" stroke="#e91e63" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="3" fill="#ffd54f"/>`}
 return s+"</svg>"}
const put=(id,f)=>document.getElementById(id).innerHTML=f();
put("f1",sunflower);put("f2",rose);put("f3",blossom);put("f4",rose);put("f5",sunflower);put("bud",rose);
(function(){const b=document.getElementById("bud"),o=document.createElement("div");o.className="orbit";
 for(let i=0;i<8;i++){const e=document.createElement("i");e.style.setProperty("--a",i*45+"deg");e.innerHTML=i%2?blossom():sunflower();o.appendChild(e)}
 b.appendChild(o);const it=document.getElementById("intro");
 for(let i=0;i<40;i++){const d=document.createElement("span");d.className="sp";d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${2+Math.random()*3}px;--dl:${Math.random()*3}s`;it.appendChild(d)}})();

/* canvas: petals + golden dust */
const cv=document.getElementById("c"),ctx=cv.getContext("2d");let W,H;
function size(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
size();addEventListener("resize",size);
const rnd=(a,b)=>a+Math.random()*(b-a),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const SH={
 rose:{c:["#ff7b9f","#bf1650"],w:[9,18],p(c){c.moveTo(0,-1);c.bezierCurveTo(1.05,-.95,1.05,.55,0,1);c.bezierCurveTo(-1.05,.55,-1.05,-.95,0,-1)}},
 sun:{c:["#ffd93d","#f29b00"],w:[7,12],p(c){c.moveTo(0,-1.9);c.quadraticCurveTo(.75,0,0,1.9);c.quadraticCurveTo(-.75,0,0,-1.9)}},
 blossom:{c:["#fff0f5","#ff9fbd"],w:[8,14],p(c){c.moveTo(0,-.6);c.bezierCurveTo(-.3,-1.15,-1.05,-.75,-.85,0);c.bezierCurveTo(-.6,.75,-.1,1.05,0,1.15);c.bezierCurveTo(.1,1.05,.6,.75,.85,0);c.bezierCurveTo(1.05,-.75,.3,-1.15,0,-.6)}},
 lotus:{c:["#ffffff","#f06fa0"],w:[9,16],p(c){c.moveTo(0,-1.7);c.bezierCurveTo(.9,-.6,.8,.9,0,1.1);c.bezierCurveTo(-.8,.9,-.9,-.6,0,-1.7)}},
 lavender:{c:["#d9c2ff","#7e57c2"],w:[6,10],p(c){c.moveTo(0,-1.5);c.quadraticCurveTo(.45,0,0,1.5);c.quadraticCurveTo(-.45,0,0,-1.5)}},
 hibiscus:{c:["#ff7a6b","#b3125a"],w:[8,13],p(c){c.moveTo(0,-.9);c.bezierCurveTo(1.3,-1.1,1.3,.9,0,1);c.bezierCurveTo(-1.3,.9,-1.3,-1.1,0,-.9)}},
 jasmine:{c:["#ffffff","#f3e2a9"],w:[5,9],p(c){c.moveTo(.9,0);c.ellipse(0,0,.9,1.2,0,0,6.283)}},
 mari:{c:["#ffb04a","#e85d04"],w:[8,13],p(c){c.moveTo(0,-1.3);c.bezierCurveTo(.95,-1,.95,.9,0,1.3);c.bezierCurveTo(-.95,.9,-.95,-1,0,-1.3)}}};
const K=Object.keys(SH),cap=()=>opened?Math.min(130,Math.round(W/9)):Math.min(70,Math.round(W/16));
let petals=[],opened=false,mx=-999,my=-999;
function make(x,y,b){const k=K[Math.floor(Math.random()*K.length)],s=SH[k];
 const p={k,x,y,sz:rnd(s.w[0],s.w[1]),rot:rnd(0,6.28),vr:rnd(-.03,.03),ph:rnd(0,6.28),fs:rnd(.02,.05),vx:0,vy:rnd(.6,1.8),b:!!b};
 if(b){const a=rnd(0,6.28),v=rnd(3,12);p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v-4;p.sz*=1.2}return p}
for(let i=0;i<cap();i++)petals.push(make(rnd(0,W),rnd(-H,H)));
const sparks=[],HUES=[42,48,36,340,350,322,28];
function fire(x,y,n,pw){pw=pw||1;
 for(let i=0;i<n;i++){const p=make(x,y,true),a=i/n*6.283+rnd(-.12,.12),v=rnd(5,16)*pw*(i%2?1:.6);
  p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v-3;p.sz*=rnd(1.1,1.7);petals.push(p)}
 for(let i=0;i<n*1.6;i++){const a=rnd(0,6.283),v=rnd(2,13)*pw;
  sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,dc:rnd(.012,.03),r:rnd(1.2,3.2),h:HUES[Math.floor(Math.random()*HUES.length)]})}
 if(petals.length>650)petals.splice(0,petals.length-650)}
const burst=(x,y,n)=>fire(x,y,n,1);
const dust=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,2.4),vx:rnd(-.15,.15),vy:rnd(-.35,-.08),ph:rnd(0,6.28)}));
function drawP(p){const s=SH[p.k];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(p.sz,p.sz*Math.cos(p.ph));
 const g=ctx.createLinearGradient(0,-1,0,1);g.addColorStop(0,s.c[0]);g.addColorStop(1,s.c[1]);
 ctx.fillStyle=g;ctx.globalAlpha=.95;ctx.beginPath();s.p(ctx);ctx.fill();ctx.restore()}
let t=0;
function frame(){ctx.clearRect(0,0,W,H);t+=.016;
 ctx.globalCompositeOperation="lighter";
 dust.forEach(d=>{d.x+=d.vx+Math.sin(t+d.ph)*.2;d.y+=d.vy;if(d.y<-10){d.y=H+10;d.x=rnd(0,W)}
  const a=.35+.35*Math.sin(t*2+d.ph);
  ctx.fillStyle=`rgba(255,200,110,${a*.18})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r*4,0,6.3);ctx.fill();
  ctx.fillStyle=`rgba(255,236,180,${a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.3);ctx.fill()});
 for(let i=sparks.length-1;i>=0;i--){const k=sparks[i];k.vx*=.96;k.vy=k.vy*.96+.12;k.x+=k.vx;k.y+=k.vy;k.l-=k.dc;
  if(k.l<=0){sparks.splice(i,1);continue}
  ctx.fillStyle=`hsla(${k.h},100%,65%,${k.l*.22})`;ctx.beginPath();ctx.arc(k.x,k.y,k.r*4.5,0,6.3);ctx.fill();
  ctx.fillStyle=`hsla(${k.h},100%,88%,${k.l})`;ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,6.3);ctx.fill()}
 ctx.globalCompositeOperation="source-over";
 for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.ph+=p.fs*2;p.rot+=p.vr;
  if(p.b){p.vx*=.97;p.vy=p.vy*.97+.14;p.x+=p.vx;p.y+=p.vy;if(p.vy>1.6&&Math.abs(p.vx)<1.5){p.b=false;p.vy=rnd(.8,1.6)}}
  else{p.y+=p.vy;p.x+=Math.sin(t*1.1+p.ph*.3)*.7+.25+p.vx;p.vx*=.98;
   const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<120&&d>1){const f=(120-d)/120*5;p.x+=dx/d*f;p.y+=dy/d*f}}
  if(p.y>H+30||p.x>W+40||p.x<-40){
   if(petals.length>cap()&&!p.b){petals.splice(i,1);continue}
   p.y=-20;p.x=rnd(0,W);p.b=false;p.vx=0;p.vy=rnd(.6,1.8)}
  drawP(p)}
 requestAnimationFrame(frame)}
if(reduce){dust.forEach(()=>{});}else requestAnimationFrame(frame);

/* chime */
let ac;function chime(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 n.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+i*.13;o.type="sine";o.frequency.value=f;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.12,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+1.3);
 o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+1.4)})}catch(e){}}

/* birthday song (synthesized music-box melody, no audio file needed) */
const TRACK=""; /* optional: put your own recording in the repo, e.g. "song.mp3", to play it instead */
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[494,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
const LYR=["Happy birthday to you","Happy birthday to you","Happy birthday dear "+NAME,"Happy birthday to you"],LSTART=[0,6,12,18],BEAT=.6;
const mus=document.createElement("button"),capEl=document.getElementById("cap");let song=null;
const CH={G:[98,196,246.94,293.66],D:[146.83,185,220,293.66],C:[130.81,196,261.63,329.63]},BARS="GDDGGCDG";
function stopSong(){if(!song)return;const s=song;song=null;s.timers.forEach(clearTimeout);
 if(s.audio)s.audio.pause();if(s.g&&ac)s.g.gain.setTargetAtTime(0,ac.currentTime,.05);
 try{speechSynthesis.cancel()}catch(e){}
 capEl.textContent="";mus.classList.remove("on");mus.setAttribute("aria-label","Play the birthday song")}
function tone(f,t0,len,out,type,v){const o=ac.createOscillator(),g=ac.createGain(),end=t0+len+.3;
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.0008,end);
 o.connect(g).connect(out);o.start(t0);o.stop(end+.05)}
function bell(f,t0,len,out){[[1,.2],[2,.06],[3,.025]].forEach(([m,a])=>{const o=ac.createOscillator(),g=ac.createGain(),end=t0+len*1.4+.9;
 o.type="sine";o.frequency.value=f*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(a,t0+.01);g.gain.exponentialRampToValueAtTime(.0008,end);
 o.connect(g).connect(out);o.start(t0);o.stop(end+.05)})}
function sing(text,rate,pitch){try{const u=new SpeechSynthesisUtterance(text),V=speechSynthesis.getVoices();
 u.voice=V.find(v=>/en/i.test(v.lang)&&/female|samantha|zira|veena|heera|jenny|aria/i.test(v.name))||V.find(v=>/^en/i.test(v.lang))||null;
 u.rate=rate;u.pitch=pitch;u.volume=.95;speechSynthesis.speak(u)}catch(e){}}
function playSong(){stopSong();const s=song={timers:[]},T=(fn,ms)=>s.timers.push(setTimeout(fn,ms));
 mus.classList.add("on");mus.setAttribute("aria-label","Stop the birthday song");
 LYR.forEach((ln,i)=>{const ws=ln.split(" "),t0=LSTART[i]*BEAT*1000,span=5*BEAT*1000;
  T(()=>{capEl.innerHTML=ws.map((w,k)=>`<span class="w${i==2&&k==3?" nm":""}">${w.replace(/</g,"&lt;")}</span>`).join(" ")},t0);
  ws.forEach((w,k)=>T(()=>{const e=capEl.children[k];if(e)e.classList.add("on")},t0+span*k/ws.length+60));
  if(!TRACK)T(()=>sing(ln,.72,1.45),t0)});
 if(!reduce){LSTART.forEach(b=>T(()=>burst(rnd(W*.3,W*.7),rnd(H*.35,H*.55),22),b*BEAT*1000+300));
  T(()=>burst(W*.5,H*.45,45),24*BEAT*1000)}
 if(!TRACK)T(()=>sing("Happy birthday, "+NAME+"!",.95,1.7),24*BEAT*1000+300);
 T(stopSong,(24*BEAT+3.8)*1000);
 if(TRACK){s.audio=new Audio(TRACK);s.audio.play().catch(()=>{});s.audio.onended=stopSong;return}
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  const g=ac.createGain();g.gain.value=.9;g.connect(ac.destination);s.g=g;
  const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.33;fb.gain.value=.3;wet.gain.value=.35;
  g.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
  const st=ac.currentTime+.1;let t=st;
  SONG.forEach(([f,d])=>{bell(f,t,d*BEAT,g);t+=d*BEAT});
  [...BARS].forEach((c,b)=>{const [bs,x,y,z]=CH[c],t0=st+b*3*BEAT;
   tone(bs,t0,BEAT*.9,g,"triangle",.3);tone(bs*2,t0,BEAT*.9,g,"sine",.12);
   [1,2].forEach(k=>[x,y,z].forEach(f=>tone(f,t0+k*BEAT,BEAT*.8,g,"triangle",.045)));
   [x,y,z].forEach(f=>tone(f,t0,BEAT*3,g,"sine",.03))})}catch(e){}}
mus.addEventListener("click",()=>song?stopSong():playSong());

/* interaction */
const fls=[...document.querySelectorAll(".fl")];
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;const nx=e.clientX/W-.5,ny=e.clientY/H-.5;
 fls.forEach(f=>{const z=+f.dataset.z;f.style.translate=`${(-nx*z).toFixed(1)}px ${(-ny*z).toFixed(1)}px`})});
addEventListener("pointerleave",()=>{mx=my=-999});
function flowerBurst(x,y,n){const mk=[sunflower,rose,blossom];
 for(let i=0;i<n;i++){const e=document.createElement("div"),sz=rnd(55,140),a=i/n*6.283+rnd(-.2,.2),d=rnd(Math.min(W,H)*.25,Math.max(W,H)*.55);
  e.innerHTML=mk[i%3]();e.style.cssText=`position:fixed;left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;z-index:9;pointer-events:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))`;
  e.firstChild.style.cssText="width:100%;height:100%;display:block";document.body.appendChild(e);
  const dx=Math.cos(a)*d,dy=Math.sin(a)*d;
  const an=e.animate([{transform:"translate(0,0) scale(0) rotate(0deg)",opacity:1},
   {transform:`translate(${dx*.8}px,${dy*.8}px) scale(1.1) rotate(${rnd(-200,200)}deg)`,opacity:1,offset:.4},
   {transform:`translate(${dx}px,${dy+220}px) scale(.8) rotate(${rnd(-420,420)}deg)`,opacity:0}],
   {duration:rnd(2300,3400),easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"});
  an.onfinish=()=>e.remove()}}
function rocket(x,y,top){for(let k=0;k<14;k++)setTimeout(()=>sparks.push({x,y:y-(y-top)*k/14,vx:rnd(-.6,.6),vy:rnd(0,1),l:1,dc:.045,r:3,h:45}),k*32);
 setTimeout(()=>{fire(x,top,140,1.5);flowerBurst(x,top,10)},14*32)}
function flashFx(){const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
 [0,.18,.36].forEach(d=>{const r=document.createElement("div");r.className="ring";r.style.setProperty("--d",d+"s");document.body.appendChild(r);setTimeout(()=>r.remove(),2200)})}
setInterval(()=>{if(opened&&!reduce&&!document.hidden)fire(rnd(W*.12,W*.88),rnd(H*.12,H*.5),rnd(22,34),.9)},2400);
document.getElementById("intro").addEventListener("click",()=>{
 opened=true;document.body.classList.add("open");
 while(petals.length<cap())petals.push(make(rnd(0,W),rnd(-H*.6,0)));
 if(!reduce){flashFx();fire(W/2,H/2,90,1.2);
  [[500,.2,.3],[800,.8,.3],[1100,.5,.2]].forEach(([d,x,y])=>setTimeout(()=>fire(W*x,H*y,50,1),d))}
 chime([523,659,784,1047,1319]); setTimeout(()=>{if(!song)playSong()},1800)});
addEventListener("pointerdown",e=>{if(opened&&!reduce&&!e.target.closest("#cake,#music"))burst(e.clientX,e.clientY,10)});
const cake=document.getElementById("cake"),wish=document.getElementById("wish");
const MSG="Wishing you a year of sunshine, laughter, and everything that makes you bloom. Today the whole garden is yours.";
cake.addEventListener("click",()=>{if(cake.classList.contains("out"))return;
 cake.classList.add("out");document.getElementById("hint").textContent="Your wish is on its way";
 try{if(!song)playSong()}catch(e){}
 if(!reduce){const r=cake.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/3;flashFx();fire(x,y,140,1.4);flowerBurst(x,y,16);
  const m=document.querySelector("main");m.classList.add("shake");setTimeout(()=>m.classList.remove("shake"),700);
  rocket(x,y,H*.22);
  [[350,.15,.3],[700,.85,.28],[1000,.5,.15],[1400,.25,.5],[1800,.75,.5],[2300,.5,.35]].forEach(([d,fx,fy])=>setTimeout(()=>{fire(W*fx,H*fy,80,1.2);flowerBurst(W*fx,H*fy,6)},d));
  setTimeout(()=>rocket(W*.3,H*.85,H*.3),900);setTimeout(()=>rocket(W*.7,H*.85,H*.3),1300)}
 wish.classList.add("on");let i=0;
 (function type(){wish.textContent=MSG.slice(0,++i);if(i<MSG.length)setTimeout(type,reduce?0:38)})()});
</script>
